<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC Air-Air TVA 5,5%</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 12px;
        }

        header {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #10b981;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .search-section {
            background: white;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-search {
            background: #2563eb;
            color: white;
        }

        .btn-search:active {
            background: #1e40af;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:active {
            background: #e0e0e0;
        }

        .filter-section {
            background: white;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .filter-section h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #333;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }

        .filter-btn:active {
            transform: scale(0.98);
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .results {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .results-header {
            padding: 12px 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
        }

        .results-header h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-info {
            font-size: 12px;
            color: #999;
        }

        .table-container {
            overflow-x: auto;
            max-height: 70vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead {
            background: #f9f9f9;
            position: sticky;
            top: 0;
        }

        th {
            padding: 8px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:active {
            background: #f9f9f9;
        }

        .brand {
            font-weight: 600;
            color: #2563eb;
        }

        .eligible {
            background: #d1fae5;
            color: #065f46;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }

        @media (min-width: 768px) {
            .container {
                padding: 16px;
            }

            .stats {
                grid-template-columns: repeat(4, 1fr);
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 10px 12px;
            }
        }
    </style>
</head>

        <div class="filter-section">

        <div class="results">

                        </tr>
                    </thead>
                    <tbody id="tbody">
                    </tbody>
                </table>
                <div id="empty" class="empty" style="display:none;">Aucun résultat</div>
            </div>
        </div>
    </div>

        let filters = {
            search: '',
            brands: new Set(),
            families: new Set(),
            types: new Set(),
            powers: new Set(),
            eligible: new Set()
        };

        function init() {
            const brands = [...new Set(DATA.map(d => d['Marque']))].sort();
            const families = [...new Set(DATA.map(d => d['Famille']))].sort();
            const types = ['Mono-split', 'Multi-split'];
            const powers = [...new Set(DATA.map(d => String(d['Froid (kW)'])))].sort((a,b) => parseFloat(a) - parseFloat(b));
            const eligibles = ['Oui'];

            brands.forEach(b => createButton('brands', b, 'brand'));
            families.forEach(f => createButton('families', f, 'family'));
            types.forEach(t => createButton('types', t, 'type'));
            powers.forEach(p => createButton('powers', p + ' kW', 'power', p));
            eligibles.forEach(e => createButton('eligible', '✓ ' + e, 'eligible', e));

            display(DATA);
        }

        function createButton(containerId, label, filterType, value) {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.textContent = label;
            btn.dataset.value = value || label;
            btn.dataset.type = filterType;
            
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const v = this.dataset.value;
                const type = this.dataset.type;
                
                if (type === 'brand') {
                    filters.brands.has(v) ? filters.brands.delete(v) : filters.brands.add(v);
                } else if (type === 'family') {
                    filters.families.has(v) ? filters.families.delete(v) : filters.families.add(v);
                } else if (type === 'type') {
                    filters.types.has(v) ? filters.types.delete(v) : filters.types.add(v);
                } else if (type === 'power') {
                    filters.powers.has(v) ? filters.powers.delete(v) : filters.powers.add(v);
                } else if (type === 'eligible') {
                    filters.eligible.has(v) ? filters.eligible.delete(v) : filters.eligible.add(v);
                }
                
                updateButtonStates(filterType);
                apply();
            });
            
            document.getElementById(containerId).appendChild(btn);
        }

        function updateButtonStates(filterType) {
            const buttons = document.querySelectorAll('.filter-btn[data-type="' + filterType + '"]');
            buttons.forEach(btn => {
                const value = btn.dataset.value;
                const type = btn.dataset.type;
                let isActive = false;
                
                if (type === 'brand') isActive = filters.brands.has(value);
                else if (type === 'family') isActive = filters.families.has(value);
                else if (type === 'type') isActive = filters.types.has(value);
                else if (type === 'power') isActive = filters.powers.has(value);
                else if (type === 'eligible') isActive = filters.eligible.has(value);
                
                if (isActive) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function search() {
            filters.search = document.getElementById('search').value.toLowerCase();
            apply();
        }

        function apply() {
            let result = DATA.filter(item => {
                let match = true;
                
                if (filters.search) {
                    const text = (item['Unité intérieure'] + ' ' + item['Groupe extérieur'] + ' ' + item['Gamme']).toLowerCase();
                    if (!text.includes(filters.search)) match = false;
                }
                
                if (filters.brands.size > 0 && !filters.brands.has(item['Marque'])) match = false;
                if (filters.families.size > 0 && !filters.families.has(item['Famille'])) match = false;
                if (filters.types.size > 0 && !filters.types.has(item['Montage'])) match = false;
                if (filters.powers.size > 0 && !filters.powers.has(String(item['Froid (kW)']))) match = false;
                if (filters.eligible.size > 0 && !filters.eligible.has(item['Éligibilité'])) match = false;
                
                return match;
            });
            
            display(result);
        }

        function display(items) {
            const tbody = document.getElementById('tbody');
            const empty = document.getElementById('empty');
            const count = document.getElementById('count');
            const resultCount = document.getElementById('resultCount');
            
            tbody.innerHTML = '';
            count.textContent = items.length;
            resultCount.textContent = items.length;
            
            if (items.length === 0) {
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="brand">${item['Marque']}</td>
                    <td><strong>${item['Famille']}</strong></td>
                    <td>${item['Montage'] === 'Mono-split' ? '●' : '≈'}</td>
                    <td style="font-size:11px;">${item['Unité intérieure']}</td>
                    <td style="font-size:11px;">${item['Groupe extérieur']}</td>
                    <td><strong>${item['Froid (kW)']}</strong>/${item['Chaud (kW)']}</td>
                    <td style="font-size:11px;">${item['À ajouter au devis'] ? item['À ajouter au devis'].substring(0,20) : '—'}</td>
                    <td><span class="eligible">✓ ${item['Éligibilité']}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function reset() {
            document.getElementById('search').value = '';
            filters = {
                search: '',
                brands: new Set(),
                families: new Set(),
                types: new Set(),
                powers: new Set(),
                eligible: new Set()
            };
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            display(DATA);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
